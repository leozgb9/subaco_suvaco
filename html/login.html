<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/stylelogin.css">
    <link rel="icon" href="../img/Midia.jpg">
</head>

<body>

    <!-- HEADER -->
    <header>

        <img src="../img/subaco_ou_suvaco_nome.png" class="img_nav" alt="Subaco ou Suvaco">

        <div class="nav">
            <a href="../index.html">Home</a>
            <a href="../html/sobre.html">Sobre</a>
            <a href="../index.html#section_contatos_avalia">Contato</a>
        </div>
        <div id="login">
            <a href="#" class="ativo">Login</a>
        </div>

    </header>

    <!-- MAIN -->
    <main>

        <!-- CARD -->
        <section class="cartao">

            <h1>Fiscal de Vida Alheia</h1>

            <form class="formulario" action="#" method="post">
                <label for="login_email">Email:</label>
                <input type="email" id="login_email" name="email" placeholder="usuario@gmail.com" autocomplete="email" required>

                <label for="login_senha">Senha:</label>
                <input type="password" id="login_senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

                <button type="submit">Entrar</button>

                <p class="troca">
                    Ainda não tem conta?
                    <a href="../html/cadastro.html">Cadastre-se</a>
                </p>
            </form>

        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Subaco ou Suvaco. Todos os direitos reservados.</p>
    </footer>

    </div>
	</div>

</body>
